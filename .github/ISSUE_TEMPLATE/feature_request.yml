name: 改善提案 / Feature request
description: 用途と期待する改善を共有してください。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと / Problem
      description: どんな場面で困っていますか？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案 / Proposal
      description: 期待する動作や使い方を説明してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・補足 / Alternatives and context
