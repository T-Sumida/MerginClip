<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MarginClip</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand"><span class="brand-icon" aria-hidden="true">m</span><span>MarginClip<span class="brand-tag">READ. THINK. KEEP.</span></span></div>
        <button id="library-toggle" class="icon-button" title="保存済みメモ" aria-label="保存済みメモ" aria-expanded="false">☷</button>
      </header>
      <aside id="library" hidden>
        <div class="section-label">YOUR NOTES <span id="note-count"></span></div>
        <input id="search" type="search" placeholder="タイトル・URL・本文で検索" aria-label="保存済みメモを検索" />
        <div id="note-list"></div>
        <div class="backup-actions"><button id="backup" class="subtle-button">全メモをバックアップ</button><button id="restore" class="subtle-button">復元</button></div>
        <input id="restore-file" type="file" accept="application/json,.json" hidden />
      </aside>
      <section class="page-card" aria-label="メモの対象ページ">
        <div class="section-label"><span id="page-mode">CURRENT PAGE</span><button id="follow" class="subtle-button" hidden>閲覧中のページへ戻る</button></div>
        <h1 id="page-title">ページを読み込んでいます…</h1>
        <a id="page-url" target="_blank" rel="noopener noreferrer"></a>
        <div class="page-meta"><span id="article-status">記事を確認中</span><button id="refresh" class="subtle-button" aria-label="記事を再取得">↻ 再取得</button></div>
      </section>
      <div id="message" role="status" aria-live="polite" hidden></div>
      <div id="conflict-actions" hidden><button id="recover" class="subtle-button">編集内容を退避して最新版を開く</button></div>
      <main class="note-area">
        <div class="note-heading"><span class="section-label">MY NOTES</span><span id="save-status" role="status" aria-live="polite">ローカル保存</span></div>
        <div id="toolbar" class="toolbar" role="toolbar" aria-label="メモの書式">
          <button data-command="heading" title="見出し" aria-label="見出し" aria-pressed="false">H₂</button>
          <button data-command="bold" title="太字 (Ctrl+B)" aria-label="太字" aria-pressed="false"><b>B</b></button>
          <button data-command="italic" title="斜体 (Ctrl+I)" aria-label="斜体" aria-pressed="false"><i>I</i></button>
          <span class="toolbar-divider"></span>
          <button data-command="bulletList" title="箇条書き" aria-label="箇条書き" aria-pressed="false">≡</button>
          <button data-command="orderedList" title="番号付きリスト" aria-label="番号付きリスト" aria-pressed="false">1.</button>
          <button data-command="blockquote" title="引用" aria-label="引用" aria-pressed="false">❝</button>
          <button data-command="codeBlock" title="コードブロック" aria-label="コードブロック" aria-pressed="false">&lt;/&gt;</button>
          <button data-command="link" title="リンク" aria-label="リンク" aria-pressed="false">↗</button>
          <button data-command="image" title="画像を追加（貼り付けも可能）" aria-label="画像を追加">▧</button>
          <button data-command="undo" title="元に戻す (Ctrl+Z)" aria-label="元に戻す">↶</button>
          <button data-command="redo" title="やり直す (Ctrl+Shift+Z)" aria-label="やり直す">↷</button>
        </div>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
        <div id="editor"></div>
        <div class="note-foot"><span id="word-count">0 文字</span><button id="help-toggle" class="subtle-button" aria-expanded="false">書き方のヒント</button></div>
        <div id="help" hidden><p><code># + 空白</code> で見出し、<code>- + 空白</code> でリスト、<code>&gt; + 空白</code> で引用。<code>**太字**</code>、<code>`コード`</code>、行頭の <code>```</code> も使えます。</p><p>Markdownの貼り付けで書式を反映。画像は Ctrl+V、ファイル選択、ドラッグ＆ドロップで追加できます。リンクは文字を選択して ↗ を押します。</p></div>
      </main>
      <footer class="app-footer"><button id="export" class="primary-button" disabled><span>↓</span> 記事とメモを保存 <span class="zip-badge">ZIP</span></button><p>このブラウザに自動保存 · クラウド送信なし</p></footer>
    </div>
    <dialog id="link-dialog"><form method="dialog"><h2>リンクを設定</h2><label for="link-input">URL</label><input id="link-input" type="url" placeholder="https://…" required /><p id="link-error" role="status"></p><div class="dialog-actions"><button value="cancel" formnovalidate>キャンセル</button><button id="link-remove" type="button">解除</button><button value="apply" class="primary-button">設定</button></div></form></dialog>
    <script type="module" src="/src/panel.ts"></script>
  </body>
</html>
